# ============================================================
# MAIN EXPERIMENT CONFIGURATION
# Wikipedia -> PCA fit -> GMM fit -> Aya full evaluation
# ============================================================

project:
  name: multilingual-representation-analysis-main
  seed: 42

languages:
  - ar
  - bn
  - en
  - es
  - eu
  - fa
  - fr
  - hi
  - id
  - ml
  - mr
  - ne
  - pt
  - sw
  - ta
  - te
  - ur
  - vi

language_names:
  ar: Arabic
  bn: Bengali
  en: English
  es: Spanish
  eu: Basque
  fa: Persian
  fr: French
  hi: Hindi
  id: Indonesian
  ml: Malayalam
  mr: Marathi
  ne: Nepali
  pt: Portuguese
  sw: Swahili
  ta: Tamil
  te: Telugu
  ur: Urdu
  vi: Vietnamese

# ------------------------------------------------------------
# Aya evaluation data
# ------------------------------------------------------------
# IMPORTANT: No train/analysis split. Every available Aya sample
# is evaluated after the PCA/Gaussian reference space is fitted
# on Wikipedia.
data:
  root_dir: data/aya_language_datasets
  input_column: inputs
  target_column: targets
  sample_id_column: sample_id

# ------------------------------------------------------------
# Wikipedia reference data for PCA/Gaussian fitting
# ------------------------------------------------------------
# The dataset is streamed directly from Hugging Face.
# It contains many millions of passages in some languages, so the
# experiment uses an equal deterministic cap per language.
wikipedia:
  dataset_name: CohereLabs/wikipedia-2023-11-embed-multilingual-v3
  split: train
  revision: null
  text_column: text
  max_samples_per_language: 3000
  max_tokens_per_document: 128
  shuffle_buffer_size: 10000

# ------------------------------------------------------------
# Models
# ------------------------------------------------------------
# Models run sequentially. Only mGPT and BLOOM are enabled now.
# Qwen is intentionally left as a future slot so a different Qwen
# size can be selected later without redesigning the pipeline.
models:
  mgpt:
    enabled: true
    model_name: ai-forever/mGPT
    model_type: causal_lm
    use_chat_template: false
    torch_dtype: auto

  bloom:
    enabled: true
    model_name: bigscience/bloom-560m
    model_type: causal_lm
    use_chat_template: false
    torch_dtype: auto

  qwen:
    enabled: false
    model_name: Qwen/Qwen3-8B
    model_type: causal_lm
    use_chat_template: true
    chat_template_kwargs:
      enable_thinking: false
    torch_dtype: auto

# ------------------------------------------------------------
# Aya generation
# ------------------------------------------------------------
generation:
  max_new_tokens: 30
  do_sample: true
  temperature: 0.7
  top_p: 0.9

# ------------------------------------------------------------
# Representation
# ------------------------------------------------------------
representation:
  pca_dim: 700
  pca_solver: incremental
  pca_batch_size: 1024
  gmm_components: 1
  gmm_covariance_type: diag
  gmm_reg_covar: 1.0e-6
  equal_language_priors: true

# ------------------------------------------------------------
# Runtime
# ------------------------------------------------------------
runtime:
  device: auto
  device_map: auto
  low_cpu_mem_usage: true
  trust_remote_code: false
  max_input_tokens: null
  wikipedia_batch_size: 8
  evaluation_batch_size: 8

# ------------------------------------------------------------
# Outputs
# ------------------------------------------------------------
outputs:
  root_dir: outputs
  model_dir: trained_language_models
  result_dir: analysis_results
