# ============================================================
# MAIN EXPERIMENT CONFIGURATION
# Wikipedia -> GPU PCA fit -> full Aya GMM fit -> Aya generation/evaluation
# ============================================================

project:
  name: multilingual-representation-analysis-main
  seed: 42

languages:
  - ar
  - bn
  - en
  - es
  - eu
  - fa
  - fr
  - hi
  - id
  - ml
  - mr
  - ne
  - pt
  - sw
  - ta
  - te
  - ur
  - vi

language_names:
  ar: Arabic
  bn: Bengali
  en: English
  es: Spanish
  eu: Basque
  fa: Persian
  fr: French
  hi: Hindi
  id: Indonesian
  ml: Malayalam
  mr: Marathi
  ne: Nepali
  pt: Portuguese
  sw: Swahili
  ta: Tamil
  te: Telugu
  ur: Urdu
  vi: Vietnamese

# ------------------------------------------------------------
# Aya evaluation data
# ------------------------------------------------------------
# All available Aya samples are used. GMMs are fitted on 100% of Aya
# for each language. There is no train/test split.
data:
  root_dir: data/aya_language_datasets
  input_column: inputs
  target_column: targets
  sample_id_column: sample_id

# ------------------------------------------------------------
# Wikipedia reference data for PCA fitting only
# ------------------------------------------------------------
# Equal deterministic cap prevents high-resource languages from
# dominating the shared representation reference space.
wikipedia:
  dataset_name: CohereLabs/wikipedia-2023-11-embed-multilingual-v3
  split: train
  revision: null
  text_column: text
  max_samples_per_language: 3000
  max_tokens_per_document: 128
  shuffle_buffer_size: 10000

# ------------------------------------------------------------
# Models
# ------------------------------------------------------------
# Enabled models run sequentially. Current main experiment:
# mGPT + BLOOM. Qwen is reserved for future experiments and is
# disabled by default so different Qwen sizes can be tested later.
models:
  mgpt:
    enabled: true
    model_name: ai-forever/mGPT
    model_type: causal_lm
    use_chat_template: false
    torch_dtype: float16

  bloom:
    enabled: true
    model_name: bigscience/bloom-560m
    model_type: causal_lm
    use_chat_template: false
    torch_dtype: float16

  qwen:
    enabled: false
    model_name: Qwen/Qwen3-8B
    model_type: causal_lm
    use_chat_template: true
    chat_template_kwargs:
      enable_thinking: false
    torch_dtype: float16

# ------------------------------------------------------------
# Aya generation
# ------------------------------------------------------------
generation:
  max_new_tokens: 64
  do_sample: true
  temperature: 0.7
  top_p: 0.9

# ------------------------------------------------------------
# Representation
# ------------------------------------------------------------
representation:
  pca_dim: 700
  pca_solver: gpu_covariance
  gmm_components: 1
  gmm_covariance_type: diag
  gmm_reg_covar: 1.0e-6
  equal_language_priors: true

# ------------------------------------------------------------
# Runtime
# ------------------------------------------------------------
runtime:
  device: cuda
  require_gpu: true
  device_map: null
  low_cpu_mem_usage: true
  trust_remote_code: false
  mixed_precision: fp16
  # Truncate long Aya inputs before the model forward/generation to keep a single T4 safe.
  # This still processes 100% of Aya sample rows; only overlong prompts are truncated.
  max_input_tokens: 512
  generation_batch_size: 1
  # GPU batch sizes. All representation/statistical tensor math is CUDA-only.
  wikipedia_batch_size: 8
  evaluation_batch_size: 8
  # Path to the reusable PCA data. Relative paths are resolved from the repo root.
  pca_data_path: outputs/pca_data

# ------------------------------------------------------------
# Outputs
# ------------------------------------------------------------
outputs:
  root_dir: outputs
  gmm_dir: aya_gmms
  result_dir: analysis_results
