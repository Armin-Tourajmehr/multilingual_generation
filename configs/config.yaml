# ============================================================
# MAIN EXPERIMENT CONFIGURATION
# Wikipedia -> PCA fit -> GMM fit -> Aya full evaluation
# ============================================================

project:
  name: multilingual-representation-analysis-main
  seed: 42

languages:
  - ar
  - bn
  - en
  - es
  - eu
  - fa
  - fr
  - hi
  - id
  - ml
  - mr
  - ne
  - pt
  - sw
  - ta
  - te
  - ur
  - vi

language_names:
  ar: Arabic
  bn: Bengali
  en: English
  es: Spanish
  eu: Basque
  fa: Persian
  fr: French
  hi: Hindi
  id: Indonesian
  ml: Malayalam
  mr: Marathi
  ne: Nepali
  pt: Portuguese
  sw: Swahili
  ta: Tamil
  te: Telugu
  ur: Urdu
  vi: Vietnamese

# ------------------------------------------------------------
# Aya evaluation data
# ------------------------------------------------------------
# All available Aya samples are evaluated. There is no train/test
# split because PCA and Gaussian reference models are fitted only
# on the independent Wikipedia corpus below.
data:
  root_dir: data/aya_language_datasets
  input_column: inputs
  target_column: targets
  sample_id_column: sample_id

# ------------------------------------------------------------
# Wikipedia reference data for PCA/Gaussian fitting
# ------------------------------------------------------------
# Equal deterministic cap prevents high-resource languages from
# dominating the shared representation reference space.
wikipedia:
  dataset_name: CohereLabs/wikipedia-2023-11-embed-multilingual-v3
  split: train
  revision: null
  text_column: text
  max_samples_per_language: 3000
  max_tokens_per_document: 128
  shuffle_buffer_size: 10000

# ------------------------------------------------------------
# Models
# ------------------------------------------------------------
# Enabled models run sequentially. Current main experiment:
# mGPT + BLOOM. Qwen is reserved for future experiments and is
# disabled by default so different Qwen sizes can be tested later.
models:
  mgpt:
    enabled: true
    model_name: ai-forever/mGPT
    model_type: causal_lm
    use_chat_template: false
    torch_dtype: auto

  bloom:
    enabled: true
    model_name: bigscience/bloom-560m
    model_type: causal_lm
    use_chat_template: false
    torch_dtype: auto

  qwen:
    enabled: false
    model_name: Qwen/Qwen3-8B
    model_type: causal_lm
    use_chat_template: true
    chat_template_kwargs:
      enable_thinking: false
    torch_dtype: auto

# ------------------------------------------------------------
# Aya generation
# ------------------------------------------------------------
generation:
  max_new_tokens: 64
  do_sample: true
  temperature: 0.7
  top_p: 0.9

# ------------------------------------------------------------
# Representation
# ------------------------------------------------------------
representation:
  pca_dim: 700
  pca_solver: incremental
  pca_batch_size: 4096
  gmm_components: 1
  gmm_covariance_type: diag
  gmm_reg_covar: 1.0e-6
  equal_language_priors: true

# ------------------------------------------------------------
# Runtime
# ------------------------------------------------------------
runtime:
  device: auto
  device_map: null
  low_cpu_mem_usage: true
  trust_remote_code: false
  mixed_precision: fp16
  max_input_tokens: null
  # Number of Wikipedia passages handled per pipeline batch.
  # This is a data chunk; the model processes it on a single device.
  wikipedia_batch_size: 500
  evaluation_batch_size: 128

# ------------------------------------------------------------
# Outputs
# ------------------------------------------------------------
outputs:
  root_dir: outputs
  model_dir: trained_language_models
  result_dir: analysis_results
