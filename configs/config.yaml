# Main experiment: Wikipedia -> GPU PCA -> Aya GMM -> generation analysis.
# Models are run sequentially in the order listed below.
project:
  name: multilingual-representation-analysis
  seed: 42

languages:
  - ar
  - bn
  - en
  - es
  - eu
  - fa
  - fr
  - hi
  - id
  - ml
  - mr
  - ne
  - pt
  - sw
  - ta
  - te
  - ur
  - vi
  - zh
  - ja

language_names:
  ar: Arabic
  bn: Bengali
  en: English
  es: Spanish
  eu: Basque
  fa: Persian
  fr: French
  hi: Hindi
  id: Indonesian
  ml: Malayalam
  mr: Marathi
  ne: Nepali
  pt: Portuguese
  sw: Swahili
  ta: Tamil
  te: Telugu
  ur: Urdu
  vi: Vietnamese
  zh: Chinese
  ja: Japanese

data:
  root_dir: data/aya_language_datasets
  input_column: inputs
  target_column: targets
  sample_id_column: sample_id
  max_samples_per_language: 2000
  sampling_seed: 42

wikipedia:
  dataset_name: CohereLabs/wikipedia-2023-11-embed-multilingual-v3
  split: train
  revision: null
  text_column: text
  max_samples_per_language: 3000
  max_tokens_per_document: 128
  shuffle_buffer_size: 10000

# Enabled models are processed sequentially. Large models are disabled by default
# to keep the default Kaggle run memory-safe. Enable them explicitly on suitable GPUs.
models:
  mgpt:
    enabled: true
    model_name: ai-forever/mGPT
    model_type: causal_lm
    use_chat_template: false
    torch_dtype: float16

  bloom:
    enabled: true
    model_name: bigscience/bloom-560m
    model_type: causal_lm
    use_chat_template: false
    torch_dtype: float16

  qwen:
    enabled: true
    model_name: Qwen/Qwen3-8B
    model_type: causal_lm
    use_chat_template: true
    chat_template_kwargs:
      enable_thinking: false
    torch_dtype: float16
    # Conservative overrides if enabled on a sufficiently large GPU.
    runtime_overrides:
      wikipedia_batch_size: 1
      evaluation_batch_size: 1
      generation_batch_size: 1
      max_input_tokens: 256

  llama3_1_8b:
    enabled: false
    model_name: meta-llama/Llama-3.1-8B-Instruct
    model_type: causal_lm
    use_chat_template: true
    torch_dtype: float16
    runtime_overrides:
      wikipedia_batch_size: 1
      evaluation_batch_size: 1
      generation_batch_size: 1
      max_input_tokens: 256

generation:
  max_new_tokens: 64
  do_sample: true
  temperature: 0.7
  top_p: 0.9

representation:
  pca_dim: 700
  pca_solver: gpu_covariance
  gmm_components: 1
  gmm_covariance_type: diag
  gmm_reg_covar: 1.0e-6
  equal_language_priors: false

runtime:
  device: cuda
  require_gpu: true
  device_map: null
  low_cpu_mem_usage: true
  trust_remote_code: false
  mixed_precision: fp16
  max_input_tokens: 512
  generation_batch_size: 4
  wikipedia_batch_size: 8
  evaluation_batch_size: 8
  pca_data_path: outputs/pca_data

# POS tags are aligned from Stanza word character spans to model-token offsets.
# Missing Stanza resources are downloaded lazily when enabled; set this to false
# on offline servers and pre-download models before the run.
lexical_analysis:
  enabled: true
  strict: false
  download_missing_models: true
  stanza_model_dir: outputs/stanza_resources
  save_pos_posterior_summary: true

# This visualizes one GMM centroid per language in the PCA space for each layer.
# It is a language-centroid manifold, not a plot of every token/sample.
spectral_embedding:
  enabled: true
  n_components: 2
  n_neighbors: 5
  random_state: 42
  affinity: nearest_neighbors

smoke_test:
  # With 20 languages, 2 Aya rows/language gives at most 40 rows per model.
  # All four configured models are attempted sequentially.
  samples_per_language: 2
  wikipedia_samples_per_language: 2
  pca_dim: 16
  max_tokens_per_document: 32
  max_input_tokens: 64
  generation_max_new_tokens: 32
  generation_batch_size: 1
  wikipedia_batch_size: 1
  evaluation_batch_size: 1
  models: [mgpt, bloom, qwen, llama3_1_8b]
  continue_on_model_error: true
  # Avoid unexpected downloads of up to 20 Stanza language packages during smoke tests.
  download_stanza_models: true

outputs:
  root_dir: outputs
  gmm_dir: aya_gmms
  result_dir: analysis_results
